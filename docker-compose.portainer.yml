# s1 and s2: the whole stack in one file for Portainer (Repository → Compose path:
# docker-compose.portainer.yml, no Additional paths; a Portainer agent cannot build).
# GENERATED by scripts/portainer-stack.py from docker-compose.yml,
# docker-compose.ampere.yml and docker-compose.live.yml – change those and run it.
# The settings are the same on both servers; a stack sets only STACK_PREFIX,
# ERSATZTV_CONFIG, MEDIA_DIR, MEDIA_MOUNT, the tokens, the domains and
# VIZRS_INGEST (DOKUMENTACJA §4, „Stosy s1 i s2”).
configs:
  live-proxy:
    content: "{\n\tadmin off\n\tauto_https off\n}\n\n:8409 {\n\t@public {\n\t\tmethod GET HEAD\n\t\tpath /iptv/* /artwork/* /discover.json /device.xml /lineup.json /lineup_status.json\n\t}\n\thandle @public {\n\t\treverse_proxy ersatztv:8409 {\n\t\t\tflush_interval -1\n\t\t}\n\t}\n\thandle {\n\t\theader Content-Type \"text/plain; charset=utf-8\"\n\t\trespond \"403: web GUI ErsatzTV legacy jest zamkniete - operatorzy pracuja w panelu VizRS Live.\" 403\n\t}\n}\n"
networks:
  default:
    name: ${STACK_PREFIX:-vizplay}_default
services:
  cg:
    cpus: ${CG_CPUS:-2}
    depends_on:
      vizrs:
        condition: service_started
        required: true
    environment:
    - LEAD_SECONDS=${LEAD_SECONDS:-5}
    - TZ=Europe/Warsaw
    - VIZRS_ADDRESS=vizrs:6100
    - VIZRS_AD_PATH=${VIZRS_AD_PATH:-/(ads|commercials|reklamy)/}
    - VIZRS_AD_WITHOUT_ELEMENT=${VIZRS_AD_WITHOUT_ELEMENT:-1}
    - VIZRS_ALERT_WEBHOOK=${VIZRS_ALERT_WEBHOOK:-}
    - VIZRS_AREA=${VIZRS_AREA:-auto}
    - VIZRS_BROWSER_GPU=${VIZRS_BROWSER_GPU:-}
    - VIZRS_CAPTURE_MODE=${VIZRS_CAPTURE_MODE:-}
    - VIZRS_CHANNELS=${VIZRS_CHANNELS:-}
    - VIZRS_CHANNEL_BUSES=${VIZRS_CHANNEL_BUSES:-0}
    - VIZRS_CLIENT_DIR=/vizrs-client
    - VIZRS_CLOCK_OFFSET=${VIZRS_CLOCK_OFFSET:-}
    - VIZRS_END_OUT_SECONDS=${VIZRS_END_OUT_SECONDS:-5}
    - VIZRS_END_REF=${VIZRS_END_REF:-programme}
    - VIZRS_END_SECONDS=${VIZRS_END_SECONDS:-60}
    - VIZRS_ETV_CONFIG=/etv-config
    - VIZRS_ETV_URL=http://ersatztv:8409
    - VIZRS_FFMPEG_NVENC_BF=${VIZRS_FFMPEG_NVENC_BF:-}
    - VIZRS_FFMPEG_PRESET=${VIZRS_FFMPEG_PRESET:-ultrafast}
    - VIZRS_FFMPEG_X264_PARAMS=${VIZRS_FFMPEG_X264_PARAMS:-}
    - VIZRS_INGEST=${VIZRS_INGEST:-1=rtmp://0.0.0.0:1936/live/change-me}
    - VIZRS_INGEST_ANYTIME=${VIZRS_INGEST_ANYTIME:-1}
    - VIZRS_INGEST_IDLE_SECONDS=${VIZRS_INGEST_IDLE_SECONDS:-8}
    - VIZRS_INGEST_PUBLIC=${VIZRS_INGEST_PUBLIC:-}
    - VIZRS_INGEST_RTMP_PORT=${INGEST_RTMP_PORT:-1936}
    - VIZRS_INGEST_SRT_PORT=${INGEST_SRT_PORT:-9000}
    - VIZRS_INGEST_TOKEN=${VIZRS_INGEST_TOKEN:-}
    - VIZRS_IN_SECONDS=${VIZRS_IN_SECONDS:-5}
    - VIZRS_LIVE_SHOWS=${VIZRS_LIVE_SHOWS:-}
    - VIZRS_MAX_FPS=${VIZRS_MAX_FPS:-}
    - VIZRS_NATIVE_LAYERS=${VIZRS_NATIVE_LAYERS:-}
    - VIZRS_ON_AD=${VIZRS_ON_AD:-}
    - 'VIZRS_ON_CLIP=${VIZRS_ON_CLIP:-TAKE 4001 headline={title}|sub=Next: {next_title} at {next_start}}'
    - VIZRS_ON_END=${VIZRS_ON_END:-}
    - VIZRS_OUTPUT_URL=http://vizrs:8088/output?token=${VIZRS_OUTPUT_TOKEN:-vizrs-output-change-me}
    - VIZRS_OUT_SECONDS=${VIZRS_OUT_SECONDS:-5}
    - VIZRS_PANEL_TOKEN=${VIZRS_PANEL_TOKEN:-}
    - VIZRS_RENDERER=${VIZRS_RENDERER:-auto}
    - VIZRS_RENDERER_BIN=${VIZRS_RENDERER_BIN:-}
    - VIZRS_RENDER_SIZE=${VIZRS_RENDER_SIZE:-}
    - VIZRS_SYNC_SECONDS=${VIZRS_SYNC_SECONDS:-60}
    - VIZRS_TAPE=${VIZRS_TAPE:-0}
    - VIZRS_TOKEN=${VIZRS_TOKEN:-vizrs-operator-change-me}
    - VIZRS_BROWSER_ARGS=${VIZRS_BROWSER_ARGS:---num-raster-threads=2 --disable-smooth-scrolling}
    image: ${CG_IMAGE:-ghcr.io/sdorpl/vizrs-cg:latest}
    init: true
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    mem_limit: ${CG_MEMORY:-6g}
    networks:
      default: null
    platform: linux/arm64
    ports:
    - mode: ingress
      protocol: tcp
      published: '7700'
      target: 7700
    restart: unless-stopped
    shm_size: 512mb
    volumes:
    - ${ERSATZTV_CONFIG:-ersatztv-config}:/etv-config
    - source: vizrs-client
      target: /vizrs-client
      type: volume
      volume: {}
  ersatztv:
    cpu_shares: 2048
    depends_on:
      cg:
        condition: service_started
        required: true
      seed:
        condition: service_completed_successfully
        required: true
    environment:
    - TZ=Europe/Warsaw
    - VIZRS_CG_URL=${VIZRS_CG_URL-http://cg:7700}
    - VIZRS_FFMPEG_CUDA=${VIZRS_FFMPEG_CUDA:-}
    - VIZRS_FFMPEG_CUDA_MIN_FREE=${VIZRS_FFMPEG_CUDA_MIN_FREE:-}
    - VIZRS_FFMPEG_FPS=${VIZRS_FFMPEG_FPS:-}
    - VIZRS_FFMPEG_FPS_BLEND=${VIZRS_FFMPEG_FPS_BLEND:-}
    - VIZRS_FFMPEG_INGEST=${VIZRS_FFMPEG_INGEST-1}
    - VIZRS_FFMPEG_NO_DISCARDCORRUPT=${VIZRS_FFMPEG_NO_DISCARDCORRUPT:-}
    - VIZRS_FFMPEG_NO_SHORTEST=${VIZRS_FFMPEG_NO_SHORTEST:-}
    - VIZRS_FFMPEG_NVENC_BF=${VIZRS_FFMPEG_NVENC_BF:-}
    - VIZRS_FFMPEG_PRESET=${VIZRS_FFMPEG_PRESET:-ultrafast}
    - VIZRS_FFMPEG_READRATE_CATCHUP=${VIZRS_FFMPEG_READRATE_CATCHUP-2}
    - VIZRS_FFMPEG_STANDBY=${VIZRS_FFMPEG_STANDBY:-}
    - VIZRS_FFMPEG_SYNC_RAM=${VIZRS_FFMPEG_SYNC_RAM:-1}
    - VIZRS_FFMPEG_X264_PARAMS=${VIZRS_FFMPEG_X264_PARAMS:-}
    - DOTNET_EnableWriteXorExecute=0
    - DOTNET_GCHeapHardLimit=0x60000000
    - DOTNET_gcServer=0
    - VIZRS_BRIDGE_TOKEN=${VIZRS_BRIDGE_TOKEN:?ustaw VIZRS_BRIDGE_TOKEN}
    expose:
    - '8409'
    image: ${LIVE_LEGACY_IMAGE:-ghcr.io/sdorpl/vizrs-live-legacy:26.11.5}
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    networks:
      default: null
    platform: linux/arm64
    restart: unless-stopped
    tmpfs:
    - /transcode:size=${TRANSCODE_TMPFS:-4g}
    volumes:
    - ${ERSATZTV_CONFIG:-ersatztv-config}:/config
    - read_only: true
      source: vizrs-client
      target: /vizrs
      type: volume
      volume: {}
    - ${MEDIA_DIR:-seed-media}:${MEDIA_MOUNT:-/media}:ro
  ingest:
    depends_on:
      cg:
        condition: service_started
        required: true
      seed:
        condition: service_completed_successfully
        required: true
    entrypoint:
    - /vizrs/vizrs-ffmpeg
    - vizrs-ingest
    environment:
      TZ: Europe/Warsaw
      VIZRS_CG_URL: http://cg:7700
      VIZRS_INGEST: ${VIZRS_INGEST:-1=rtmp://0.0.0.0:1936/live/change-me}
      VIZRS_INGEST_IDLE_MS: ${VIZRS_INGEST_IDLE_MS:-15000}
      VIZRS_INGEST_TOKEN: ${VIZRS_INGEST_TOKEN:-}
    image: ghcr.io/ersatztv/legacy:latest
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    networks:
      default: null
    ports:
    - ${INGEST_RTMP_PORT:-1936}:1936
    - ${INGEST_SRT_PORT:-9000}:9000/udp
    - 1937-1943:1937-1943
    - 9001-9007:9001-9007/udp
    restart: unless-stopped
    volumes:
    - read_only: true
      source: vizrs-client
      target: /vizrs
      type: volume
      volume: {}
  live:
    depends_on:
      cg:
        condition: service_started
        required: true
      ersatztv:
        condition: service_started
        required: true
    environment:
      TZ: Europe/Warsaw
      VIZRS_LIVE_BRIDGE: http://ersatztv:8409
      VIZRS_LIVE_BRIDGE_TOKEN: ${VIZRS_BRIDGE_TOKEN}
      VIZRS_LIVE_CG_TOKEN: ${VIZRS_PANEL_TOKEN:?ustaw VIZRS_PANEL_TOKEN (live API sidecara)}
      VIZRS_LIVE_CG_URL: http://cg:7700
      VIZRS_LIVE_MULTIVIEW_MAX: ${VIZRS_LIVE_MULTIVIEW_MAX:-4}
      VIZRS_LIVE_STREAM_URL: ${VIZRS_LIVE_STREAM_URL:-}
      VIZRS_LIVE_TOKEN: ${VIZRS_LIVE_TOKEN:?ustaw VIZRS_LIVE_TOKEN}
      VIZRS_LIVE_VIZRS_CHANNELS: ${VIZRS_CHANNEL_BUSES:-0}
      VIZRS_LIVE_VIZRS_OUTPUT_TOKEN: ${VIZRS_OUTPUT_TOKEN:-vizrs-output-change-me}
      VIZRS_LIVE_VIZRS_URL: ${VIZRS_LIVE_VIZRS_URL:-:${VIZRS_PORT:-8788}}
    image: ${LIVE_IMAGE:-ghcr.io/sdorpl/vizrs-live:26.11.5}
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    networks:
      default: null
    ports:
    - ${VIZRS_LIVE_PORT:-8090}:8090
    restart: unless-stopped
    volumes:
    - ${MEDIA_DIR:-seed-media}:${MEDIA_MOUNT:-/media}:ro
  proxy:
    configs:
    - source: live-proxy
      target: /etc/caddy/Caddyfile
    depends_on:
      ersatztv:
        condition: service_started
        required: true
    image: ${PROXY_IMAGE:-caddy:alpine}
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    networks:
      default: null
    ports:
    - ${ETV_PORT:-8409}:8409
    restart: unless-stopped
  seed:
    environment:
      TZ: Europe/Warsaw
    image: ${SEED_IMAGE:-ghcr.io/sdorpl/vizrs-seed:latest}
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    networks:
      default: null
    platform: linux/arm64
    restart: 'no'
    user: 0:0
    volumes:
    - source: vizrs-data
      target: /vizrs-data
      type: volume
      volume: {}
    - ${ERSATZTV_CONFIG:-ersatztv-config}:/ersatztv-config
    - source: vizrs-client
      target: /vizrs-client
      type: volume
      volume: {}
    - source: seed-media
      target: /media
      type: volume
      volume: {}
  vizrs:
    cpus: ${VIZRS_CPUS:-0.5}
    depends_on:
      seed:
        condition: service_completed_successfully
        required: true
    environment:
      TZ: Europe/Warsaw
      VIZRS_OUTPUT_TOKEN: ${VIZRS_OUTPUT_TOKEN:-vizrs-output-change-me}
      VIZRS_TCP: '6100'
      VIZRS_TOKEN: ${VIZRS_TOKEN:-vizrs-operator-change-me}
    image: ghcr.io/sdorpl/vizrs:latest
    labels:
      com.centurylinklabs.watchtower.enable: 'false'
    networks:
      default: null
    platform: linux/arm64
    ports:
    - ${VIZRS_PORT:-8788}:8088
    restart: unless-stopped
    volumes:
    - source: vizrs-data
      target: /data
      type: volume
      volume: {}
volumes:
  ersatztv-config:
    name: ${STACK_PREFIX:-vizplay}_ersatztv-config
  seed-media:
    name: ${STACK_PREFIX:-vizplay}_seed-media
  vizrs-client:
    name: ${STACK_PREFIX:-vizplay}_vizrs-client
  vizrs-data:
    name: ${STACK_PREFIX:-vizplay}_vizrs-data
x-timezone:
  TZ: Europe/Warsaw
x-tokens:
  VIZRS_OUTPUT_TOKEN: ${VIZRS_OUTPUT_TOKEN:-vizrs-output-change-me}
  VIZRS_TOKEN: ${VIZRS_TOKEN:-vizrs-operator-change-me}
