name: Usuń szkic wydania
# Ręcznie (Actions → Usuń szkic wydania → Run workflow): kasuje szkice wydań o podanej nazwie.
# Opublikowanych wydań i znaczników nie rusza. Kroki: wspólny workflow pakietu w VizRS CG System.
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Nazwa szkicu (np. v26.11.13)'
        required: true

permissions:
  contents: write

jobs:
  delete:
    uses: sdorpl/VizRS-CG-System/.github/workflows/drafts.yml@main
    with:
      name: ${{ inputs.name }}
