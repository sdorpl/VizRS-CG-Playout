name: Release
# Wydanie po wypchnięciu znacznika v* (np. v26.11.10) albo ręcznie (Actions → Release → Run workflow).
#   binarka vizrs-cg (Rust) z client/ (vizrs-etv-client i vizrs-ffmpeg, statyczne musl) i etv/: Linux x86_64 i arm64 (.tar.gz)
#   obraz Docker ghcr.io/<właściciel>/vizrs-cg:<wersja> i :latest (amd64 + arm64)
#   obraz ghcr.io/<właściciel>/vizrs-seed:<wersja> i :latest (dane startowe i programy ErsatzTV; stosy s1 i s2)
#   panel (panel/, dawny VizRS Live): binarka vizrs-live (musl, x86_64 i arm64), obrazy
#   ghcr.io/<właściciel>/vizrs-live:<wersja> i vizrs-live-legacy:<wersja>[-legacy<wersja>] (amd64 + arm64), AppImage okna panelu
#   VizRS-CG-Playout-<wersja>-x86_64.AppImage; jedna wersja produktu: Cargo.toml = panel/server = panel/desktop = tauri.conf.json = most
#   wydanie na GitHubie z sumami SHA256SUMS.txt (ręcznie bez `publish`: szkic)
# Bramka: CI sidecara (ci.yml) i CI panelu (panel-ci.yml: serwer, okno na 3 systemach, gate.sh, hwaccel, AppImage)
# przez workflow_call – obrazy i wydanie powstają dopiero po zielonym CI tego commita; AppImage z joba appimage CI panelu.
# Znacznik zawsze v<wersja>. :latest wszystkich obrazów tylko przy publikacji (znacznik albo ręcznie z `publish`)
# wersji bez łącznika; wersja z łącznikiem (v26.12.1-rc1) = wydanie wstępne, szkic – same obrazy z numerem.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Wersja (np. 26.11.32) – bez znacznika powstaje tylko szkic wydania'
        required: true
      publish:
        description: 'Opublikuj od razu: znacznik powstaje na tym commicie, szkic tej wersji jest zastępowany'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  panel_wersja:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel
    outputs:
      v: ${{ steps.w.outputs.v }}
      tag: ${{ steps.w.outputs.tag }}
      pre: ${{ steps.w.outputs.pre }}
      lv: ${{ steps.w.outputs.lv }}
      legacy: ${{ steps.w.outputs.legacy }}
      owner: ${{ steps.w.outputs.owner }}
      latest: ${{ steps.w.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - name: Wersje
        id: w
        env:
          INPUT: ${{ inputs.version }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then R=$GITHUB_REF_NAME; else R=$INPUT; fi
          V=${R#v}
          # jedna wersja produktu: sidecar, panel, okno, most (wydanie wstępne v26.11.11-test.1 → porównanie z 26.11.11)
          VB=${V%%-*}
          for f in ../Cargo.toml server/Cargo.toml desktop/Cargo.toml; do
            C=$(sed -n 's/^version = "\(.*\)"/\1/p' "$f" | head -1)
            [ "$VB" = "$C" ] || { echo "wersja $R ≠ $C z $f"; exit 1; }
          done
          T=$(sed -n 's/^ *"version": *"\(.*\)".*/\1/p' desktop/tauri.conf.json | head -1)
          B=$(sed -n 's#.*<Version>\(.*\)</Version>.*#\1#p' bridge/VizRS.Bridge.csproj | head -1)
          [ "$VB" = "$T" ] && [ "$VB" = "$B" ] || { echo "wersja $R ≠ tauri.conf.json $T / VizRS.Bridge.csproj $B"; exit 1; }
          BC=$(sed -n 's#.*const string Version = "\(.*\)";.*#\1#p' bridge/Bridge.cs | head -1)
          [ "$VB" = "$BC" ] || { echo "wersja $R ≠ Version $BC z bridge/Bridge.cs"; exit 1; }
          L=$(sed -n 's#^LEGACY_IMAGE=##p' .env.example)
          case "$L" in *:v*) LV="-legacy${L##*:v}";; *) LV="";; esac
          pre=false; case "$V" in *-*) pre=true;; esac
          latest=false; [ "$PUBLISH" = true ] && [ "$pre" = false ] && latest=true
          {
            echo "v=$V"; echo "tag=v$V"; echo "pre=$pre"; echo "lv=$LV"; echo "legacy=$L"
            echo "owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"; echo "latest=$latest"
          } | tee -a "$GITHUB_OUTPUT"

  ci:
    uses: ./.github/workflows/ci.yml

  panel_ci:
    uses: ./.github/workflows/panel-ci.yml

  bin:
    needs: panel_wersja
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04: starsza glibc = binarka działa na większej liczbie dystrybucji
          # programy ErsatzTV statycznie (musl): działają w obrazie ErsatzTV niezależnie od jego glibc
          - { os: ubuntu-22.04, name: linux-x86_64, musl: x86_64-unknown-linux-musl, rustflags: "" }
          - { os: ubuntu-22.04-arm, name: linux-arm64, musl: aarch64-unknown-linux-musl, rustflags: "-C target-cpu=neoverse-n1 -C opt-level=3" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.musl }}
      - run: RUSTFLAGS="${{ matrix.rustflags }}" cargo build --release --locked --bin vizrs-cg
      - run: RUSTFLAGS="${{ matrix.rustflags }}" cargo build --release --locked --bin vizrs-etv-client --bin vizrs-ffmpeg --target ${{ matrix.musl }}
      - name: Paczka
        run: |
          v=${VERSION#v}; d=VizRS-CG-Playout-$v-${{ matrix.name }}; mkdir -p dist/$d
          cp target/release/vizrs-cg dist/$d/
          cp -r etv README.md config.example.json dist/$d/
          mkdir dist/$d/client
          cp target/${{ matrix.musl }}/release/vizrs-etv-client target/${{ matrix.musl }}/release/vizrs-ffmpeg dist/$d/client/
          cd dist && tar czf $d.tar.gz $d && rm -rf $d && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: dist/*

  docker:
    # publikuje obrazy – dopiero po zielonym CI sidecara
    needs: [panel_wersja, ci]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.panel_wersja.outputs.tag }}
      LATEST: ${{ needs.panel_wersja.outputs.latest }}
    env:
      # bez artefaktu „*.dockerbuild” (zapis budowy) – download-artifact w jobie release nie umiał go pobrać
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4
      # Binarka powstaje krzyżowo na platformie budującej; QEMU tylko dla apt-get w etapie arm64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nazwa obrazu
        id: img
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/vizrs-cg" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.img.outputs.name }}:${{ env.TAG }}
            ${{ env.LATEST == 'true' && format('{0}:latest', steps.img.outputs.name) || '' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: seed/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=seed
          cache-to: type=gha,mode=max,scope=seed
          tags: |
            ghcr.io/${{ github.repository_owner }}/vizrs-seed:${{ env.TAG }}
            ${{ env.LATEST == 'true' && format('ghcr.io/{0}/vizrs-seed:latest', github.repository_owner) || '' }}

  panel_bin:
    needs: panel_wersja
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64, musl: x86_64-unknown-linux-musl, rustflags: "" }
          - { os: ubuntu-22.04-arm, name: linux-arm64, musl: aarch64-unknown-linux-musl, rustflags: "-C target-cpu=neoverse-n1 -C opt-level=3" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.musl }}
      - run: RUSTFLAGS="${{ matrix.rustflags }}" cargo build --release --locked --target ${{ matrix.musl }}
        working-directory: panel/server
      - name: Paczka
        env:
          V: ${{ needs.panel_wersja.outputs.v }}
        run: |
          b=server/target/${{ matrix.musl }}/release/vizrs-live
          "$b" --version
          d=VizRS-CG-Playout-panel-$V-${{ matrix.name }}; mkdir -p "dist/$d"
          cp "$b" ../README.md ../CHANGELOG.md .env.example ../docker-compose.live.yml "dist/$d/"
          cd dist && tar czf "$d.tar.gz" "$d" && rm -rf "$d" && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: panel-bin-${{ matrix.name }}
          path: panel/dist/*

  panel_docker:
    # publikuje obrazy – dopiero po zielonym CI panelu (w tym gate.sh i hwaccel.sh)
    needs: [panel_wersja, panel_ci]
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: panel
    env:
      # bez artefaktu „*.dockerbuild” (zapis budowy) – download-artifact w jobie release nie umiał go pobrać
      DOCKER_BUILD_RECORD_UPLOAD: false
      IMG: ghcr.io/${{ needs.panel_wersja.outputs.owner }}
      V: ${{ needs.panel_wersja.outputs.v }}
      LV: ${{ needs.panel_wersja.outputs.lv }}
      LATEST: ${{ needs.panel_wersja.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      # Bez QEMU: panel kompiluje się krzyżowo, DLL mostu to IL – oba Dockerfile budują na platformie budującej.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: panel
          file: panel/docker/live.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=live
          cache-to: type=gha,mode=max,scope=live
          tags: |
            ${{ env.IMG }}/vizrs-live:${{ env.V }}
            ${{ env.LATEST == 'true' && format('{0}/vizrs-live:latest', env.IMG) || '' }}
      - uses: docker/build-push-action@v6
        with:
          context: panel
          file: panel/docker/legacy-bridge.Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          build-args: LEGACY_IMAGE=${{ needs.panel_wersja.outputs.legacy }}
          tags: |
            ${{ env.IMG }}/vizrs-live-legacy:${{ env.V }}${{ env.LV }}
            ${{ env.LATEST == 'true' && format('{0}/vizrs-live-legacy:latest', env.IMG) || '' }}

  release:
    needs: [panel_wersja, ci, panel_ci, bin, docker, panel_bin, panel_docker]
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.panel_wersja.outputs.v }}
      TAG: ${{ needs.panel_wersja.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'bin-*'
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'panel-*'
          merge-multiple: true
      # AppImage okna z CI panelu (job appimage: GStreamer w paczce sprawdzony)
      - uses: actions/download-artifact@v4
        with:
          name: vizrs-cg-playout-appimage
          path: appimage
      - name: AppImage okna panelu
        run: |
          a=$(find appimage -maxdepth 1 -name '*.AppImage' | head -1)
          [ -n "$a" ] || { echo "::error::brak AppImage z CI panelu"; exit 1; }
          cp "$a" "dist/VizRS-CG-Playout-$V-x86_64.AppImage" && chmod +x dist/*.AppImage && ls -la dist
      - name: Sumy kontrolne
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Usuń szkic tej wersji (publikacja ręczna)
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and .name == \"$TAG\") | .id" |
            xargs -r -I{} gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/{}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.panel_wersja.outputs.tag }}
          # znacznik tworzony przy publikacji wskazuje zbudowany commit, nie gałąź domyślną
          target_commitish: ${{ github.sha }}
          draft: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
          prerelease: ${{ needs.panel_wersja.outputs.pre == 'true' }}
          make_latest: ${{ needs.panel_wersja.outputs.latest }}
          generate_release_notes: true
          files: dist/*
          body: |
            **Docker (amd64 / arm64):** `ghcr.io/${{ github.repository_owner }}/vizrs-cg:${{ needs.panel_wersja.outputs.tag }}` – stos: `docker compose pull && docker compose up -d` (docs/DOKUMENTACJA.md §4).
            **Panel (amd64 / arm64):** `ghcr.io/${{ needs.panel_wersja.outputs.owner }}/vizrs-live:${{ needs.panel_wersja.outputs.v }}` i `ghcr.io/${{ needs.panel_wersja.outputs.owner }}/vizrs-live-legacy:${{ needs.panel_wersja.outputs.v }}${{ needs.panel_wersja.outputs.lv }}` (ErsatzTV legacy `${{ needs.panel_wersja.outputs.legacy }}` z mostem; powered by ErsatzTV) – nakładka `docker-compose.live.yml`, `COMPOSE_PROFILES=grafika,ingest`.
            **Linux – okno panelu:** `VizRS-CG-Playout-*-x86_64.AppImage` – natywny klient panelu na serwerze (adres panelu, np. przez proxy z TLS, i token; wymaga WebKitGTK 4.1).
            **Linux x86_64 / arm64:** archiwum z `vizrs-cg` (wymaga Chromium w PATH albo `VIZRS_BROWSER`), programami ErsatzTV (`client/`: klient elementu `vizrs-etv-client` i nakładka ffmpeg `vizrs-ffmpeg`, statyczne) i elementem grafiki (`etv/`).
