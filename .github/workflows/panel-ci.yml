# CI panelu VizRS CG Playout (dawny VizRS Live, katalog panel/): serwer (fmt, clippy, testy), oba obrazy, stos testowy z proxy, e2e z Playwright.
# Te same kroki co panel/tests/gate.sh. Niczego nie publikuje (obrazy tylko lokalnie na maszynie CI), binarka panelu jako artefakt.
# Obrazy na ghcr i wydanie: release.yml (znacznik v* albo ręcznie) wywołuje ten workflow (workflow_call), publikuje
# dopiero po zielonym i wydaje AppImage z joba appimage (artefakt vizrs-cg-playout-appimage).
name: CI panelu

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# github.workflow rozdziela przebiegi z wypchnięcia i z wydania (wywołany workflow ma nazwę wywołującego) –
# wydanie z main nie przerywa CI panelu na main ani odwrotnie
concurrency:
  group: panel-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serwer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # wspólny rdzeń wyglądu (vizrs-ui.css) i moduły okna (desktop/src/gpu.rs, scale.rs, screen.rs, conn_url.rs)
      # = kopie z VizRS CG System w wersji z server/web/CG_SYSTEM
      - name: Wersja CG System dla vizrs-ui.css i modułów okna
        id: cg
        run: echo "ref=$(cat panel/server/web/CG_SYSTEM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: sdorpl/VizRS-CG-System
          ref: ${{ steps.cg.outputs.ref }}
          path: cg
          sparse-checkout: |
            source/web/vizrs-ui.css
            source/shell/src/gpu.rs
            source/shell/src/scale.rs
            source/shell/src/screen.rs
            source/shell/src/conn_url.rs
          sparse-checkout-cone-mode: false
      - name: vizrs-ui.css i moduły okna zgodne z CG System
        working-directory: panel
        run: scripts/sync-ui.sh --check ../cg
      - name: Caddyfile proxy = kopia w docker-compose.live.yml
        working-directory: panel
        run: scripts/check-caddy.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel/server
      - name: cargo fmt / clippy / test / build
        working-directory: panel/server
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
          ./target/release/vizrs-live --version
          sha256sum target/release/vizrs-live
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-live-linux-x86_64
          path: panel/server/target/release/vizrs-live
      # release.yml buduje obrazy na amd64 i arm64 – tu kontrola, że oba Dockerfile budują się krzyżowo (bez publikacji)
      - uses: docker/setup-buildx-action@v3
      - name: obrazy arm64 (budowa krzyżowa)
        working-directory: panel
        run: |
          docker buildx build --platform linux/arm64 -f docker/live.Dockerfile .
          docker buildx build --platform linux/arm64 -f docker/legacy-bridge.Dockerfile --build-arg LEGACY_IMAGE="$(sed -n 's#^LEGACY_IMAGE=##p' .env.example)" .

  obrazy-i-e2e:
    needs: serwer
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel/server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/playwright
      # ffmpeg z libx265 – próbka HEVC dla K18 (mux.js: HEVC i AC-3); bez niego test jest pomijany
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: obraz panelu
        working-directory: panel
        run: docker build -f docker/live.Dockerfile -t vizrs-live:ci .
      # krok serwera (fmt, clippy, test) zrobił job serwer – bramka bez niego
      - name: bramka (obraz legacy z mostem, stos z proxy, seed, e2e)
        working-directory: panel
        env:
          GATE_BEZ_SERWERA: "1"
        run: tests/gate.sh
      - name: akceleracja sprzętowa w obrazie legacy (Intel VAAPI/QSV, AMD VAAPI, NVIDIA NVENC)
        working-directory: panel
        run: tests/hwaccel.sh vizrs-live-legacy:dev
      - name: dziennik przy błędzie
        if: failure()
        run: |
          docker logs vizrs-live-test-legacy 2>&1 | tail -200 || true
          cat "${VIZRS_LIVE_TEST_DIR:-$HOME/.cache/vizrs-live-test}/panel.log" || true

  # aplikacja VizRS Live na Tauri 2 (desktop/, osobny workspace z zależnościami; serwer panelu bez zmian)
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            panel/desktop
            panel/server
      - name: biblioteki okna (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev xvfb
      - name: cargo fmt / clippy / test / build
        working-directory: panel/desktop
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --release --locked
      - name: test aplikacji w działaniu (start bez panelu, panel przez pośrednika, okno połączenia)
        if: runner.os == 'Linux'
        working-directory: panel
        run: |
          (cd server && cargo build --release --locked)
          xvfb-run -a node desktop/tests/okno.cjs

  # AppImage okna panelu (Ubuntu 22.04 – starsza glibc = działa na większej liczbie dystrybucji) z GStreamerem
  # dla podglądu strumienia; sprawdzenie wtyczek w paczce. Ten plik trafia do wydania (release.yml).
  appimage:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: panel/desktop
          key: appimage
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file desktop-file-utils
      # GStreamer z wtyczkami do paczki (bundleMediaFramework w tauri.conf.json): WebKitGTK dekoduje H.264/AAC
      # podglądu strumienia przez GStreamer, a sam rdzeń 1.20 z paczki nie ładuje nowszych wtyczek systemu
      - run: sudo apt-get install -y --no-install-recommends gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      - name: AppImage (bundler Tauri)
        working-directory: panel/desktop
        env:
          # linuxdeploy / appimagetool to AppImage – na runnerze bez FUSE rozpakowują się same
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # h264parse (videoparsersbad) jest w plugins-bad – WebKit potrzebuje go do H.264 przez MSE
          GSTREAMER_INCLUDE_BAD_PLUGINS: "1"
        run: npx --yes @tauri-apps/cli@2 build --ci --bundles appimage
      - name: wtyczki GStreamera w paczce, --version
        run: |
          a=$(find desktop/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' | head -1)
          [ -n "$a" ] || { echo "::error::brak AppImage"; exit 1; }
          scripts/check-appimage.sh "$a"
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-cg-playout-appimage
          path: panel/desktop/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
