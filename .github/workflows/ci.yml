name: CI
# Testy przy każdym wypchnięciu na main, PR i ręcznie, binarka jako artefakt.
# Obraz sidecara i wydanie: release.yml (znacznik v* albo ręcznie) wywołuje ten workflow (workflow_call) i publikuje
# dopiero po zielonym – znaczniki nie uruchamiają CI osobno.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Chromium z obrazu runnera, bez piaskownicy (AppArmor w Ubuntu 24.04), jak w obrazie Dockera.
      VIZRS_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # tools/check-docs.sh porównuje CHANGELOG z HEAD~1
      # zasady pakietu (CLAUDE.md – bloki pakiet:*, GEMINI.md, docs/AGENCI.md) = CG System w wersji z docs/ZASADY_CG_SYSTEM
      - name: Wersja CG System dla zasad pakietu
        id: zasady
        run: echo "ref=$(cat docs/ZASADY_CG_SYSTEM)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: sdorpl/VizRS-CG-System
          ref: ${{ steps.zasady.outputs.ref }}
          path: cg-zasady
          sparse-checkout: |
            CLAUDE.md
            GEMINI.md
            docs/AGENCI.md
            tools/sync-zasady.sh
            tools/check-docs.sh
            source/Cargo.toml
          sparse-checkout-cone-mode: false
      - name: Zasady pakietu zgodne z CG System
        run: tools/sync-zasady.sh --check cg-zasady
      - name: Dokumentacja stanu (CHANGELOG, STATUS)
        run: tools/check-docs.sh
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-cg-linux-x86_64
          path: |
            target/release/vizrs-cg
            target/release/vizrs-etv-client
            target/release/vizrs-ffmpeg
      # Testy kontraktu: binarki jako czarne skrzynki, udawany VizRS.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # ffmpeg dla testów live ingest (bez niego są pomijane: odbiornik RTMP, przejęcie, slot live).
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: npm test
