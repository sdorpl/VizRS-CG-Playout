name: CI
# Testy przy każdym wypchnięciu i PR, binarka jako artefakt.
# Obraz sidecara i wydanie: release.yml (znacznik v* albo ręcznie).
on:
  push:
    branches: [main, rust-edit]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Chromium z obrazu runnera, bez piaskownicy (AppArmor w Ubuntu 24.04), jak w obrazie Dockera.
      VIZRS_BROWSER_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --release --locked
      # Wspólny stos s1 i s2 zgodny ze źródłami (docker-compose.yml, .ampere, .live).
      - run: python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
      - run: python3 scripts/portainer-stack.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: vizrs-cg-linux-x86_64
          path: |
            target/release/vizrs-cg
            target/release/vizrs-etv-client
            target/release/vizrs-ffmpeg
      # Testy kontraktu: binarki jako czarne skrzynki, udawany VizRS.
      - uses: actions/setup-node@v4
        with:
          node-version: current
      # ffmpeg dla testów live ingest (bez niego są pomijane: odbiornik RTMP, przejęcie, slot live).
      - run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: npm test
