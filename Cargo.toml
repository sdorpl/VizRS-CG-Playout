# vizrs-cg – VizRS graphics sidecar for ErsatzTV (+ vizrs-ffmpeg, vizrs-etv-client), static musl binaries.
#
# Allowed dependencies (VizRS package rule "dependencies only from the list"; a new one is the user's decision):
#   png – decoding PNG frames from headless Chromium (DevTools screenshots),
#   regex – ad detection and path patterns in graphics rules (no default features).
# JSON, HTTP, base64, DevTools and scaling are our own code; contract tests in Node.js use only the standard library.

[package]
name = "vizrs-cg"
version = "26.11.36"
license = "MIT"
edition = "2024"
rust-version = "1.87"
description = "VizRS graphics for ErsatzTV channels: commands on clip start and burn-in of /output"
publish = false

[[bin]]
name = "vizrs-cg"
path = "src/main.rs"

[[bin]]
name = "vizrs-etv-client"
path = "src/bin/vizrs-etv-client.rs"

[[bin]]
name = "vizrs-ffmpeg"
path = "src/bin/vizrs-ffmpeg.rs"

[dependencies]
png = "0.18.1"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }

[profile.release]
opt-level = 3
lto = true
strip = true
