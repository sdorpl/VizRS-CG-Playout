# VizRS CG System + VizRS CG Playout sidecar + ErsatzTV.
#
#   docker compose up -d
#
#   ErsatzTV     http://<server>:8409
#   VizRS Trio   http://<server>:8788/trio   token vizrs-operator-change-me
#   Sidecar      http://<server>:7700/health
#   Live API     http://<server>:7700/api/live/* for VizRS Live (token VIZRS_PANEL_TOKEN)
#
# Live ingest (RTMP/SRT takes a channel over, DOKUMENTACJA §1): set VIZRS_INGEST_TOKEN
# and VIZRS_INGEST (e.g. "1=rtmp://0.0.0.0:1936/live/<key>"), then
#   docker compose --profile ingest up -d
#
# The first start fills empty volumes from seed/: the VizRS show "newsroom-info24"
# and ErsatzTV channel 1 with the VizRS element, test videos in seed/media.
# Other channels: Channel → Deco → Graphics Elements → add "VizRS".
# Change the tokens before opening the ports.

# One time zone for the whole stack, fixed: clocks in the graphics (Chromium),
# VizRS, the ErsatzTV schedule and EPG, and the logs.
x-timezone: &timezone
  TZ: Europe/Warsaw

x-tokens: &tokens
  VIZRS_TOKEN: ${VIZRS_TOKEN:-vizrs-operator-change-me}
  VIZRS_OUTPUT_TOKEN: ${VIZRS_OUTPUT_TOKEN:-vizrs-output-change-me}

services:
  # Copies seed/ into empty volumes and the ErsatzTV clients into theirs, then
  # exits; volumes with data stay untouched. Built from the repository, so the
  # stack needs no files on the host (Portainer: deploy from Git).
  seed:
    build:
      context: .
      dockerfile: seed/Dockerfile
    labels:
      # Updates come from the stack (Portainer); Watchtower recreates a container
      # without its compose labels and the next deploy fails on the name.
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
    user: "0:0"
    environment:
      <<: *timezone
    volumes:
      - vizrs-data:/vizrs-data
      - ersatztv-config:/ersatztv-config
      - vizrs-client:/vizrs-client
      - seed-media:/media

  vizrs:
    image: ghcr.io/sdorpl/vizrs:latest
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      <<: [*timezone, *tokens]
      VIZRS_TCP: "6100"
    volumes:
      - vizrs-data:/data
    ports:
      - "${VIZRS_PORT:-8788}:8088"

  cg:
    build: .
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    # A minimal init as PID 1 reaps the helper processes of a crashed browser.
    init: true
    depends_on:
      - vizrs
    environment:
      <<: *timezone
      VIZRS_ADDRESS: vizrs:6100
      VIZRS_TOKEN: ${VIZRS_TOKEN:-vizrs-operator-change-me}
      VIZRS_OUTPUT_URL: http://vizrs:8088/output?token=${VIZRS_OUTPUT_TOKEN:-vizrs-output-change-me}
      # Commands per clip; "\n" separates lines.
      VIZRS_ON_CLIP: "${VIZRS_ON_CLIP:-TAKE 4001 headline={title}|sub=Next: {next_title} at {next_start}}"
      VIZRS_ON_AD: ${VIZRS_ON_AD:-}
      # 1 = each ErsatzTV channel has its own antenna in VizRS, with no setup
      # (needs VizRS with channel antennas, TCP "@N").
      VIZRS_CHANNEL_BUSES: ${VIZRS_CHANNEL_BUSES:-0}
      # Per-channel overrides (JSON): commands, shows, another VizRS.
      VIZRS_CHANNELS: ${VIZRS_CHANNELS:-}
      VIZRS_AD_PATH: ${VIZRS_AD_PATH:-/(ads|commercials|reklamy)/}
      # Schedule items without the VizRS element count as ads (0 = off).
      VIZRS_AD_WITHOUT_ELEMENT: ${VIZRS_AD_WITHOUT_ELEMENT:-1}
      # Graphics of an item: commands this long after its start, OUT of the pages
      # taken this long before its end (negative = no OUT).
      VIZRS_IN_SECONDS: ${VIZRS_IN_SECONDS:-5}
      VIZRS_OUT_SECONDS: ${VIZRS_OUT_SECONDS:-5}
      # Graphics before the end of a programme ("Za chwilę: {next_title}"), "" = none:
      # TAKE this long before the end, OUT of its pages this long before it;
      # the end of the guide entry (programme) or of the item (item).
      VIZRS_ON_END: ${VIZRS_ON_END:-}
      VIZRS_END_SECONDS: ${VIZRS_END_SECONDS:-60}
      VIZRS_END_OUT_SECONDS: ${VIZRS_END_OUT_SECONDS:-5}
      VIZRS_END_REF: ${VIZRS_END_REF:-programme}
      # Player buffer vs. graphics delay: ErsatzTV may run this far ahead of the clock.
      LEAD_SECONDS: ${LEAD_SECONDS:-4}
      # Graphics render size, scaled to the channel: "" = channel size (default: no
      # scaling, the smoothest and cheapest), 720p, 1280x720, 1080p.
      # Per channel: &render=1080p in the element URL (vizrs.yml).
      VIZRS_RENDER_SIZE: ${VIZRS_RENDER_SIZE:-}
      # Graphics areas of the channel, e.g. 1920x140+0+930 for a ticker strip (several
      # comma-separated): Chromium draws and ffmpeg overlays only them; empty = the whole channel.
      # Per channel: &area=1920x140+0+930 in the element URL (vizrs.yml).
      VIZRS_AREA: ${VIZRS_AREA:-}
      # Capture rate limit; empty = the rate of ErsatzTV (Normalize Framerate included).
      # A host too slow for it draws half the rate by itself. A limit that does not
      # divide the channel's rate (30 on 50) makes the motion uneven.
      VIZRS_MAX_FPS: ${VIZRS_MAX_FPS:-}
      # How Chromium's pictures are taken: frames (default: one per channel frame, even
      # motion; chromium-headless-shell) or screencast (60 Hz, every n-th frame).
      VIZRS_CAPTURE_MODE: ${VIZRS_CAPTURE_MODE:-}
      # Seconds added to the clock of the graphics page: the transcode runs ahead
      # of the air time, so clocks and countdowns on air would run late by as much.
      VIZRS_CLOCK_OFFSET: ${VIZRS_CLOCK_OFFSET:-}
      # 1 = the sidecar moves a standing VizRS crawl itself (frames mode): Chromium films its
      # tape now and then instead of drawing and encoding a PNG every frame.
      VIZRS_TAPE: ${VIZRS_TAPE:-0}
      # Who draws the burn-in: chromium, native (VizRS vizrs-render, no browser) or auto (default):
      # auto (native while everything on air is native, Chromium otherwise).
      VIZRS_RENDERER: ${VIZRS_RENDERER:-auto}
      VIZRS_RENDERER_BIN: ${VIZRS_RENDERER_BIN:-}
      VIZRS_NATIVE_LAYERS: ${VIZRS_NATIVE_LAYERS:-}
      # 1 = Chromium draws on the GPU (EGL) instead of the CPU; needs the card in this
      # container (docker-compose.nvidia.yml). Less CPU per frame, some GPU memory.
      VIZRS_BROWSER_GPU: ${VIZRS_BROWSER_GPU:-}
      # The sidecar installs the ErsatzTV programs and syncs channels and page elements.
      VIZRS_ETV_CONFIG: /etv-config
      VIZRS_ETV_URL: http://ersatztv:8409
      VIZRS_CLIENT_DIR: /vizrs-client
      VIZRS_SYNC_SECONDS: ${VIZRS_SYNC_SECONDS:-60}
      # Live ingest: shared secret of the ingest listeners; empty = live ingest off.
      VIZRS_INGEST_TOKEN: ${VIZRS_INGEST_TOKEN:-}
      # 1 = a live source takes any piece over; 0 = only live programmes of the schedule.
      VIZRS_INGEST_ANYTIME: ${VIZRS_INGEST_ANYTIME:-1}
      # The same listeners as the ingest service and the host publishers reach them
      # at: VizRS Live shows them (live API) where to send.
      VIZRS_INGEST: ${VIZRS_INGEST:-1=rtmp://0.0.0.0:1936/live/change-me}
      VIZRS_INGEST_PUBLIC: ${VIZRS_INGEST_PUBLIC:-}
      VIZRS_INGEST_RTMP_PORT: ${INGEST_RTMP_PORT:-1936}
      VIZRS_INGEST_SRT_PORT: ${INGEST_SRT_PORT:-9000}
      # Live programmes as Remote Streams for the ErsatzTV schedule (/config/vizrs-live); only the
      # first filling of vizrs-live/shows.json, which VizRS Live edits. JSON:
      # [{"channel":"1","title":"Wiadomości","duration":"00:30:00","plot":"…"}]
      VIZRS_LIVE_SHOWS: ${VIZRS_LIVE_SHOWS:-}
      # Live API on :7700/api/live for VizRS Live (studio on/off air, live programmes in ErsatzTV); empty = off.
      VIZRS_PANEL_TOKEN: ${VIZRS_PANEL_TOKEN:-}
      # Only the first filling of the overlay's encoder (vizrs-live/encoder.json): from then
      # on VizRS Live sets the x264 preset, H.264 profile, x264 options, NVENC/QSV presets
      # and hardware B-frames (Profile kodowania).
      VIZRS_FFMPEG_PRESET: ${VIZRS_FFMPEG_PRESET:-}
      VIZRS_FFMPEG_X264_PARAMS: ${VIZRS_FFMPEG_X264_PARAMS:-}
      VIZRS_FFMPEG_NVENC_BF: ${VIZRS_FFMPEG_NVENC_BF:-}
      # Where alarms of the as-run log go (signal lost, studio held, graphics off); empty = nowhere.
      VIZRS_ALERT_WEBHOOK: ${VIZRS_ALERT_WEBHOOK:-}
    volumes:
      - ersatztv-config:/etv-config
      - vizrs-client:/vizrs-client
    # Chromium renders through /dev/shm; the Docker default of 64 MB is too small.
    shm_size: 512mb
    ports:
      - "7700:7700"

  ersatztv:
    image: ghcr.io/ersatztv/legacy:latest
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      cg:
        condition: service_started
    environment:
      <<: *timezone
      # ffmpeg overlay (FFmpeg path /vizrs/vizrs-ffmpeg in ErsatzTV): ffmpeg takes
      # the graphics straight from the sidecar. Empty = plain ffmpeg.
      VIZRS_CG_URL: ${VIZRS_CG_URL-http://cg:7700}
      # Channel frame rate forced by the overlay, 50 or 25 (also the target of
      # Normalize Framerate); empty = the media's rate.
      VIZRS_FFMPEG_FPS: ${VIZRS_FFMPEG_FPS:-}
      # x264/x265 preset added by the overlay, e.g. veryfast; empty = ErsatzTV's
      # (the next streaming engine passes none: x264 runs at medium). Only while there is
      # no /config/vizrs-live/encoder.json: VizRS Live sets the encoder there.
      VIZRS_FFMPEG_PRESET: ${VIZRS_FFMPEG_PRESET:-}
      # libx264 options added by the overlay, e.g. bframes=0:subme=0 (Ampere, 900p25:
      # -20% CPU, -1.4 dB SSIM; DOKUMENTACJA §1). Empty = none. Like the preset: only
      # while there is no encoder.json of VizRS Live.
      VIZRS_FFMPEG_X264_PARAMS: ${VIZRS_FFMPEG_X264_PARAMS:-}
      # Catch-up rate of the MPEG-TS channel stream (ErsatzTV reads its own HLS at
      # -readrate 1): without it each stall is lost and the stream lags. Empty = none.
      VIZRS_FFMPEG_READRATE_CATCHUP: ${VIZRS_FFMPEG_READRATE_CATCHUP-2}
      # 1 = the frame rate conversion of media faster than the channel blends
      # frames (framerate instead of fps, rate from ffprobe): 60/30 fps media on
      # a 50 or 25 fps channel move evenly. Empty = fps.
      VIZRS_FFMPEG_FPS_BLEND: ${VIZRS_FFMPEG_FPS_BLEND-1}
      # 1 = a live source of the channel (sidecar, live ingest) takes the transcode
      # over; nothing changes while the sidecar has ingest off. Empty = never.
      VIZRS_FFMPEG_INGEST: ${VIZRS_FFMPEG_INGEST-1}
      # Picture of a live programme while the studio is not on (path in this container,
      # e.g. /media/plansza.png); empty = black.
      VIZRS_FFMPEG_STANDBY: ${VIZRS_FFMPEG_STANDBY:-}
      # encode = with NVENC only the encoder runs on the card; decoding and filters on
      # the CPU (about half the GPU memory per piece, for a card shared with a desktop).
      # overlay = decoding on the CPU, scaling and the overlay of the graphics on the card,
      # frames back to the CPU for the encoder (far less CPU than encode, same GPU memory).
      # auto = overlay while the card has VIZRS_FFMPEG_CUDA_MIN_FREE MiB free (nvidia-smi
      # before each piece), encode below: no out-of-memory slate on a card shared with a desktop.
      # Empty = ErsatzTV's command (CUDA decoding and filters with NVENC).
      VIZRS_FFMPEG_CUDA: ${VIZRS_FFMPEG_CUDA:-}
      # Free GPU memory in MiB that VIZRS_FFMPEG_CUDA=auto needs for overlay (default 400).
      VIZRS_FFMPEG_CUDA_MIN_FREE: ${VIZRS_FFMPEG_CUDA_MIN_FREE:-}
      # B-frames of hardware encoders (NVENC, QSV, VAAPI) without their own, e.g. 0: each
      # B-frame keeps reference frames on the card (1080p50 NVENC: 139 MiB by default,
      # 79 MiB with 0). Empty = ffmpeg's. Only while encoder.json of VizRS Live has no
      # B-frames: they are set there.
      VIZRS_FFMPEG_NVENC_BF: ${VIZRS_FFMPEG_NVENC_BF:-}
      # 1 = without -shortest where the output ends at -t anyway: with loudnorm it
      # holds ~3 s of raw video frames (1080p50 ffmpeg 657 MB -> 268 MB). Empty = off.
      VIZRS_FFMPEG_NO_SHORTEST: ${VIZRS_FFMPEG_NO_SHORTEST:-}
      # 1 = with VIZRS_FFMPEG_CUDA=overlay (or auto) media frames wait for the graphics in
      # RAM, not on the card in front of overlay_cuda (loudnorm decodes ~3 s ahead:
      # P400, 1080p50: 359 -> 111 MiB of GPU memory, ~+430 MB RAM). Empty = off.
      VIZRS_FFMPEG_SYNC_RAM: ${VIZRS_FFMPEG_SYNC_RAM:-}
      # 1 = the MPEG-TS channel stream (a copy of the channel's own HLS) keeps the
      # last frame of each piece: new continuity counters per piece flagged it corrupt
      # and -fflags +discardcorrupt dropped it (40 ms freeze every 44 s). Empty = off.
      VIZRS_FFMPEG_NO_DISCARDCORRUPT: ${VIZRS_FFMPEG_NO_DISCARDCORRUPT:-}
    volumes:
      # Holds templates/…/script/vizrs.yml, written by seed.
      - ersatztv-config:/config
      - vizrs-client:/vizrs:ro
      # Test videos of the seeded channel; your own: MEDIA_DIR, a host path
      # (paths in ErsatzTV start with /media).
      - ${MEDIA_DIR:-seed-media}:/media:ro
    tmpfs:
      - /transcode
    ports:
      # ETV_PORT=127.0.0.1:8409 = local only, behind a reverse proxy on the host
      # (containers reaching it through the Docker host then lose it).
      - "${ETV_PORT:-8409}:8409"

  # Live ingest listeners (profile "ingest"): ffmpeg of the ErsatzTV image waits for
  # RTMP/SRT publishers and hands them to the sidecar, without transcoding.
  ingest:
    image: ghcr.io/ersatztv/legacy:latest
    profiles: ["ingest"]
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
      cg:
        condition: service_started
    entrypoint: ["/vizrs/vizrs-ffmpeg", "vizrs-ingest"]
    environment:
      <<: *timezone
      VIZRS_CG_URL: http://cg:7700
      VIZRS_INGEST_TOKEN: ${VIZRS_INGEST_TOKEN:-}
      # channel=URL, separated by ";": rtmp://0.0.0.0:1936/live/<key> (the key is the
      # password), srt://0.0.0.0:9000?passphrase=<10-79 characters> (MPEG-TS, mode=caller).
      # Only the first filling: once inputs are set in VizRS Live, the sidecar's
      # list (/config/vizrs-live/inputs.json) is in force, taken over without a restart.
      VIZRS_INGEST: ${VIZRS_INGEST:-1=rtmp://0.0.0.0:1936/live/change-me}
      # A publisher silent this long has ended (ms). Keep it above the sidecar's 5 s:
      # a shorter silence then only ends the live on air, the publisher stays.
      VIZRS_INGEST_IDLE_MS: ${VIZRS_INGEST_IDLE_MS:-10000}
    volumes:
      - vizrs-client:/vizrs:ro
    ports:
      - "${INGEST_RTMP_PORT:-1936}:1936"
      - "${INGEST_SRT_PORT:-9000}:9000/udp"
      # More inputs (VizRS Live): RTMP 1937-1943, SRT 9001-9007, the same ports on the host.
      - "1937-1943:1937-1943"
      - "9001-9007:9001-9007/udp"

volumes:
  vizrs-data:
  ersatztv-config:
  vizrs-client:
  seed-media:
